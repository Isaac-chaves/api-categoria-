# Entorno local con Docker para probar la API antes de desplegarla.
# Uso:
#   docker compose up --build
#   http://localhost:18080/controlador/categoria.php
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ventas
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 13307 en el equipo anfitrion para no chocar con un MySQL local.
      - "13307:3306"
    volumes:
      - mysql_datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ventas
      DB_USER: root
      DB_PASSWORD: root
      AUTO_INIT_DB: "true"
      DB_INIT_INTENTOS: "30"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_datos:
