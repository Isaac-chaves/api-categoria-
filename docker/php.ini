; Configuracion de PHP para produccion.
; Los errores se escriben en el log del servicio, no en la respuesta HTTP.
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; Zona horaria neutra (puede cambiarla si la necesita).
date.timezone = UTC

; Cache de opcodes para mejorar el rendimiento.
opcache.enable = 1
opcache.validate_timestamps = 0
